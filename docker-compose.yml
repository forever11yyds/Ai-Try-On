services:
  mysql:
    image: mysql:8.4
    container_name: ai-try-on-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ai_tryon
      MYSQL_USER: ai_tryon
      MYSQL_PASSWORD: ai_tryon_password
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ai_try_on_mysql_data:/var/lib/mysql

  adminer:
    image: adminer:4
    container_name: ai-try-on-adminer
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8081:8080"

volumes:
  ai_try_on_mysql_data: